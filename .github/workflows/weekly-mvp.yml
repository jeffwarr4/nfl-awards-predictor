# .github/workflows/weekly-mvp.yml
# ---------------------------------------------------------------
# Weekly NFL MVP board. Runs Tuesdays 15:00 UTC (after Monday Night
# Football) from September through February, plus manual runs.
#
# What it does:
#   1. Sets up Python + dependencies
#   2. Checks out stinger-assets (headshots + logos for the graphic)
#   3. Runs src/Predictions/predict_current.py → predictions/{year}/:
#      top10 CSVs, chips, board PNG, caption; predictions/nfl_candidates.csv
#   4. Fails loudly if the top-10 board is empty
#   5. Uploads CSVs + PNGs + captions as artifacts
#   6. Commits predictions/ back to the repo with [skip ci]
#
# The model is NOT retrained here — models/*.joblib are committed. Retrain
# locally (python -m src.modeling.train_model) and commit when data changes.
#
# Secrets (repo Settings → Secrets → Actions):
#   ANTHROPIC_API_KEY  — chips + caption; without it those steps are skipped
#   STINGER_ASSETS_PAT — only if stinger-assets is private (uncomment below)
# ---------------------------------------------------------------

name: Weekly NFL MVP Prediction

on:
  schedule:
    - cron: "0 15 * 9-12,1-2 2"   # Tuesdays 15:00 UTC, Sep–Feb
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weekly-mvp
  cancel-in-progress: true

jobs:
  predict:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Sibling checkout so STINGER_ASSETS_DIR matches the ../stinger-assets/
      # convention used locally. Asset filenames are lowercase — the runner's
      # filesystem is case-sensitive even though Windows isn't.
      - name: Checkout stinger-assets
        uses: actions/checkout@v4
        with:
          repository: jeffwarr4/stinger-assets
          path: stinger-assets
          # token: ${{ secrets.STINGER_ASSETS_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run weekly prediction
        run: python -m src.Predictions.predict_current
        env:
          PYTHONIOENCODING: utf-8
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STINGER_ASSETS_DIR: ${{ github.workspace }}/stinger-assets

      # predict_current exits non-zero on an empty board; this double-checks the
      # file it wrote so a silent regression can't publish a header-only CSV.
      - name: Fail if the top-10 board is empty
        run: |
          YEAR=$(python -c "import config; print(config.CURRENT_YEAR)")
          CSV="predictions/${YEAR}/top10_mvp_latest.csv"
          ROWS=$(( $(wc -l < "$CSV") - 1 ))
          echo "$CSV has $ROWS rows"
          if [ "$ROWS" -lt 1 ]; then
            echo "::error::Top-10 MVP board is empty"
            exit 1
          fi

      - name: Upload prediction artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nfl-mvp-${{ github.run_number }}
          path: |
            predictions/**/*.csv
            predictions/**/*.png
            predictions/**/*.txt
          retention-days: 90
          if-no-files-found: warn

      - name: Commit updated predictions
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add predictions/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: weekly NFL MVP update $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            git push
          fi
